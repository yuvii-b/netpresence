# NetPresence on OMNeT++. Normally started through `python -m netsim.omnet_run`, which exports the scene, sets the
# parameters below and runs the real engine at the end. Use it by hand like this (from the omnet/ folder):
#   ./netpresence -u Qtenv  -c General --**.sceneDir=\"generated/scene\" --numPhones=93 ...
[General]
network = netpresence.NetPresenceRoom
sim-time-limit = 60s
cmdenv-express-mode = true
cmdenv-status-frequency = 10s
record-eventlog = false
