name: Tests
# Everything that does not need a real phone: server, engine, both simulation studies, phone protocol code against a
# live server. Fails the push if any pre-declared acceptance criterion fails.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Windows too: the simulator must run on the author's Windows laptop exactly as it runs here
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: backend
      - run: npm ci || npm install
        working-directory: mobile/core
      - run: python -m tools.check
        working-directory: backend
